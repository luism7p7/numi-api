# Panel administrativo · https://numi-g01.northcentralus.cloudapp.azure.com
# Nginx entrega la SPA compilada por Vite y hace de proxy inverso hacia el backend (red interna de Docker).
server_tokens off;

upstream backend_api {
    zone backend_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:5000 resolve;
}

# HTTP: solo el reto de Let's Encrypt y la redirección a HTTPS
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name numi-g01.northcentralus.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numi-g01.northcentralus.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API (y puente con la app) -> backend, conservando la ruta /api/v1/...
    location /api/ {
        proxy_pass http://backend_api;
    }

    # SPA de Vite: cualquier otra ruta entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
