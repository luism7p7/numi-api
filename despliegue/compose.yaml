# Numi en la VM de Azure (Pasos 20 a 23 del Manual de Infraestructura, adaptados)
#
#   ~/numi/
#   ├── .env                  secretos (chmod 600, fuera de git)
#   ├── compose.yaml          este archivo
#   ├── nginx/admin.conf      proxy inverso + HTTPS del panel administrativo
#   ├── nginx/docente.conf    proxy inverso + HTTPS del panel docente
#   ├── certbot/              certificado de Let's Encrypt
#   ├── backend/              git clone numi-api
#   ├── frontend-admin/       git clone numi-admin-frontend
#   └── frontend-docente/     git clone numi-docente-frontend
#
# Solo los dos frontends (Nginx) publican puertos. MySQL y el backend quedan en la red interna de Docker.
name: numi

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Definir MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Definir MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD}
    volumes:
      - numi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Una sola API (Flask + Gunicorn) para los dos paneles y para el puente con la app
  backend:
    build:
      context: ./backend
    image: numi-api:latest
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY}
      JWT_EXP_MINUTES: "480"
      CORS_ALLOWED_ORIGINS: https://numi-g01.northcentralus.cloudapp.azure.com,https://numi-g01.northcentralus.cloudapp.azure.com:8443
      APP_API_URL: ${APP_API_URL}
      APP_API_KEY: ${APP_API_KEY}
      UPLOADS_DIR: /uploads
    volumes:
      - numi_uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"

  # Panel administrativo: Nginx entrega la SPA de Vite y reenvía /api/ al backend
  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: https://numi-g01.northcentralus.cloudapp.azure.com/api/v1
    image: numi-frontend-admin:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"       # solo redirige a HTTPS y atiende el reto de Let's Encrypt
      - "443:443"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  # Panel docente: mismo esquema en el puerto 8443
  frontend-docente:
    build:
      context: ./frontend-docente
      args:
        VITE_API_URL: https://numi-g01.northcentralus.cloudapp.azure.com:8443/api/v1
    image: numi-frontend-docente:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"   # solo redirige a HTTPS
      - "8443:8443"
    volumes:
      - ./nginx/docente.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  # Renovación del certificado:  docker compose run --rm certbot renew --webroot -w /var/www/certbot
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  numi_mysql_data:
    external: true
  numi_uploads:
    external: true
